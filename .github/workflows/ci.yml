name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test CLI
        run: |
          node bin/cli.js status || true

      - name: Verify skill directory structure
        run: |
          test -f AGENTS.md
          test -d skills/00-orchestrator
          test -d skills/05-documentation
          test -d templates/api-spec
          echo "All core skills and templates present!"
